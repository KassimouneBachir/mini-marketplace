spring.application.name=demo

# httpd local occupe deja le 8080 sur cette machine
server.port=8081

# Charge .env (format compatible .properties : cle=valeur) sans dependance tierce.
# optional: pour ne pas bloquer le demarrage si le fichier est absent (ex. CI).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway est seul maitre du schema : Hibernate ne fait que verifier qu'il correspond aux entites
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
